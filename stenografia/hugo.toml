#  [[module.replacements]]
#    from = "hugo-video"
#    to = "themes/hugo-video"

# Włączenie renderowania HTML zawartego w plikach Markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[Author]
    name = "Krzysztof Stenografow"
    bio = "Krzysztof Stenografow - ktoś i nikt zupełnie."

[Params]
    subtitle = "Nondum lingua suum, dextra peregit opus"
    description = "Nondum lingua suum, dextra peregit opus"
    sidebarFreeText = "Druga odsłona stenografii"
    blogMirror = "https://tachygrafia.blogspot.com/"
    colorScheme = "scheme-steno"
    DateFormat = "2006-01-02"

[Params.widgets]
    search = true
    recent_articles = true
    categories = true
    tags = true

[taxonomies]
  category = "kategorie"

[outputs]
  home = ["HTML", "RSS", "JSON"]

