baseURL = "https://www.stenografia.pl/"
title = "Stenografia"
languageCode = "pl-pl"
defaultContentLanguage = "pl"

# Ustawienie paginacji w nowym formacie
[pagination]
  pagerSize = 15

# Nowoczesny import motywów przez moduły

[module]
  replacements = [
    "strange-case-steno -> strange-case-steno"
  ]

  [[module.imports]]
    path = "strange-case-steno"


#[module]
#  replacements = [
#    "strange-case-steno -> strange-case-steno",
